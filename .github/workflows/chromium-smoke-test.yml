name: Chromium Smoke Test

on:
    workflow_dispatch:
    push:
        branches:
            - ci-chromium-smoke

env:
    CHROME_FLAGS: --headless --no-sandbox --disable-gpu --disable-dev-shm-usage

jobs:
    diagnose:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Build image
              run: docker build -t screenshot-smoke .

            - name: Baseline crash repro
              continue-on-error: true
              run: |
                  docker run --rm screenshot-smoke sh -c \
                    "chromium $CHROME_FLAGS --dump-dom about:blank; echo EXIT=\$?"

            - name: Variant 1 - big shm, no disable-dev-shm-usage
              continue-on-error: true
              run: |
                  docker run --rm --shm-size=2g screenshot-smoke sh -c \
                    "chromium --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null 2>&1; echo EXIT=\$?"

            - name: Variant 2 - no crashpad
              continue-on-error: true
              run: |
                  docker run --rm screenshot-smoke sh -c \
                    "chromium $CHROME_FLAGS --disable-crash-reporter --no-crashpad --dump-dom about:blank >/dev/null 2>&1; echo EXIT=\$?"

            - name: Variant 3 - run as non-root
              continue-on-error: true
              run: |
                  docker run --rm --user 1000:1000 -e HOME=/tmp screenshot-smoke sh -c \
                    "chromium $CHROME_FLAGS --dump-dom about:blank >/dev/null 2>&1; echo EXIT=\$?"

            - name: Variant 4 - increased vm.max_map_count + unconfined
              continue-on-error: true
              run: |
                  sudo sysctl -w vm.max_map_count=1048576
                  docker run --rm --security-opt seccomp=unconfined --cap-add=SYS_ADMIN screenshot-smoke sh -c \
                    "chromium $CHROME_FLAGS --dump-dom about:blank >/dev/null 2>&1; echo EXIT=\$?"

            - name: Strace the crash
              continue-on-error: true
              run: |
                  docker run --rm --cap-add=SYS_PTRACE screenshot-smoke sh -c "
                    apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq strace >/dev/null 2>&1
                    strace -f -qq -e trace=mmap,mprotect,brk,prctl chromium $CHROME_FLAGS --dump-dom about:blank 2>&1 | grep -B5 -A2 'SIGTRAP\|ENOMEM\|killed' | tail -40
                    true"

            - name: Compare - Google Chrome official build (bookworm base)
              continue-on-error: true
              run: |
                  docker run --rm debian:trixie-slim sh -c "
                    apt-get update -qq >/dev/null 2>&1
                    apt-get install -y -qq wget ca-certificates >/dev/null 2>&1
                    wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
                    apt-get install -y -qq ./google-chrome-stable_current_amd64.deb >/dev/null 2>&1
                    google-chrome-stable --version
                    google-chrome-stable $CHROME_FLAGS --dump-dom https://example.com 2>/dev/null | grep -o 'Example Domain' | head -1
                    echo EXIT=\$?"

            - name: Compare - chrome-headless-shell via puppeteer browsers
              continue-on-error: true
              run: |
                  docker run --rm node:lts-trixie-slim sh -c "
                    apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq ca-certificates libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libxkbcommon0 fonts-liberation >/dev/null 2>&1
                    npx -y @puppeteer/browsers install chrome-headless-shell@stable --path /tmp/cb >/dev/null 2>&1
                    SHELL_BIN=\$(find /tmp/cb -name chrome-headless-shell -type f | head -1)
                    \$SHELL_BIN --version
                    \$SHELL_BIN $CHROME_FLAGS --dump-dom https://example.com 2>/dev/null | grep -o 'Example Domain' | head -1
                    echo EXIT=\$?"
